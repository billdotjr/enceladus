<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <meta name="referrer" content="no-referrer">
  <title>Enceladus — Todo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-light">

  <!-- Startup gate — shown until a file handle is established -->
  <div id="startup-modal" class="startup-modal">
    <div class="startup-dialog">
      <div class="startup-logo">Enceladus</div>
      <p class="startup-sub">Your private todo list</p>
      <div class="startup-btns">
        <button id="btn-startup-reopen" class="btn btn-reopen hidden"></button>
        <hr class="startup-divider hidden" id="startup-divider">
        <button id="btn-startup-open" class="btn btn-primary">Open existing file</button>
        <button id="btn-startup-new"  class="btn">Create new file</button>
      </div>
      <p id="startup-api-warn" class="startup-warn hidden">
        ⚠ Your browser does not support the File System Access API.
        Auto-save is unavailable — use the Save button to download a copy.
      </p>
    </div>
  </div>

  <header class="topbar">
    <span class="app-title">Enceladus <a href="https://github.com/billdotjr/enceladus" target="_blank" rel="noreferrer" class="app-version">v2026-06-12</a></span>
    <div class="topbar-actions">
      <span id="api-warn" class="api-warn hidden" title="File System Access API not available — auto-save disabled">⚠</span>
      <button id="btn-refresh" class="btn" title="Re-sort, reset filters, and re-render">↻</button>
      <button id="btn-open"  class="btn">Switch file</button>
      <button id="btn-new"   class="btn">New task</button>
      <button id="btn-save"  class="btn" disabled>Save</button>
      <button id="btn-theme" class="btn btn-icon" title="Toggle dark/light mode">☀</button>
    </div>
  </header>

  <div id="file-banner" class="file-banner hidden">
    <span id="file-name"></span>
    <span id="save-status" class="save-status"></span>
  </div>

  <main>
    <div class="table-wrapper">
      <table id="task-table">
        <thead>
          <tr id="header-row"></tr>
          <tr id="filter-row"></tr>
        </thead>
        <tbody id="task-body"></tbody>
      </table>
    </div>
    <div class="table-wrapper hidden" id="private-wrapper">
      <table id="private-table">
        <tbody id="private-body"></tbody>
      </table>
    </div>
  </main>


  <script src="app.js"></script>
</body>
</html>
